<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEA Pipeline</title>
<style>
/* ══ Tokens ═══════════════════════════════════════════════════════════════ */
:root{
  --g0:#ffffff; --g1:#fbfbfd; --g2:#f5f5f7; --g3:#eeeef1; --g4:#e3e3e8;
  --g5:#c9c9d0; --g6:#8e8e97; --g7:#6e6e78; --g8:#3a3a41; --g9:#1d1d20; --g10:#0a0a0c;

  --bg:var(--g1); --raise:var(--g0); --sunken:var(--g2); --hover:var(--g2);
  --line:rgba(0,0,0,.07); --line-2:rgba(0,0,0,.12);
  --ink:var(--g10); --ink-2:var(--g7); --ink-3:var(--g6);

  --accent:#0071e3; --accent-ink:#0058b0; --accent-bg:#eef5ff; --accent-line:#cfe3ff;
  --ok:#1d8a4e; --ok-bg:#eaf7ef; --ok-line:#bfe6cf;
  --warn:#9a5b00; --warn-bg:#fff6e6; --warn-line:#ffdfa8;
  --bad:#c8352b; --bad-bg:#fdefee; --bad-line:#f8ccc8;

  --sh-1:0 1px 2px rgba(0,0,0,.04);
  --sh-2:0 1px 3px rgba(0,0,0,.06), 0 4px 12px -4px rgba(0,0,0,.06);
  --sh-3:0 2px 6px rgba(0,0,0,.06), 0 12px 32px -8px rgba(0,0,0,.12);

  --r1:8px; --r2:12px; --r3:16px; --r4:20px; --rp:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:56px; --s10:72px;

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1); --fast:.18s; --med:.28s;
}
[data-theme="dark"]{
  --bg:#000000; --raise:#141416; --sunken:#0c0c0e; --hover:#1c1c1f;
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#f5f5f7; --ink-2:#a1a1a8; --ink-3:#6e6e78;
  --accent:#0a84ff; --accent-ink:#7ab8ff; --accent-bg:#0d243d; --accent-line:#1c4a7a;
  --ok:#30d158; --ok-bg:#0d2a17; --ok-line:#1c5130;
  --warn:#ffd60a; --warn-bg:#2e2405; --warn-line:#5c4a0d;
  --bad:#ff453a; --bad-bg:#33100d; --bad-line:#6b241e;
  --sh-1:0 1px 2px rgba(0,0,0,.5);
  --sh-2:0 1px 3px rgba(0,0,0,.6), 0 6px 16px -6px rgba(0,0,0,.6);
  --sh-3:0 2px 8px rgba(0,0,0,.7), 0 16px 40px -10px rgba(0,0,0,.8);
}
@media (prefers-color-scheme:dark){
  [data-theme="auto"]{
    --bg:#000000; --raise:#141416; --sunken:#0c0c0e; --hover:#1c1c1f;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --ink:#f5f5f7; --ink-2:#a1a1a8; --ink-3:#6e6e78;
    --accent:#0a84ff; --accent-ink:#7ab8ff; --accent-bg:#0d243d; --accent-line:#1c4a7a;
    --ok:#30d158; --ok-bg:#0d2a17; --ok-line:#1c5130;
    --warn:#ffd60a; --warn-bg:#2e2405; --warn-line:#5c4a0d;
    --bad:#ff453a; --bad-bg:#33100d; --bad-line:#6b241e;
    --sh-1:0 1px 2px rgba(0,0,0,.5);
    --sh-2:0 1px 3px rgba(0,0,0,.6), 0 6px 16px -6px rgba(0,0,0,.6);
    --sh-3:0 2px 8px rgba(0,0,0,.7), 0 16px 40px -10px rgba(0,0,0,.8);
  }
}

/* ══ Base ═════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.47;letter-spacing:-.011em;
  font-feature-settings:"tnum" 0,"kern" 1}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.02em}

/* ══ Shell ════════════════════════════════════════════════════════════════ */
.shell{min-height:100vh}
.bar{position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:saturate(200%) blur(24px);-webkit-backdrop-filter:saturate(200%) blur(24px);
  border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:0 var(--s6);height:56px;
  display:flex;align-items:center;gap:var(--s4)}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;flex:none}
.wordmark{font-size:15px;font-weight:600;letter-spacing:-.02em}
.grow{flex:1}
.page{max-width:1080px;margin:0 auto;padding:var(--s8) var(--s6) var(--s10)}
.stack{display:flex;flex-direction:column;gap:var(--s7)}

/* ══ Hero ═════════════════════════════════════════════════════════════════ */
.hero{display:flex;align-items:flex-end;justify-content:space-between;
  gap:var(--s6);flex-wrap:wrap;margin-bottom:var(--s2)}
.hero-h{font-size:32px;line-height:1.12;font-weight:600;letter-spacing:-.028em}
.hero-sub{font-size:14px;color:var(--ink-2);margin-top:6px}
.hero-sub .mono{color:var(--ink-2)}

/* ══ Metrics ══════════════════════════════════════════════════════════════ */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r3);
  overflow:hidden}
@media(max-width:720px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--raise);padding:var(--s5) var(--s5) var(--s5)}
.metric-k{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.01em;
  display:flex;align-items:center;gap:6px}
.metric-v{font-size:30px;font-weight:600;letter-spacing:-.03em;margin-top:6px;
  line-height:1;transition:color var(--med) var(--ease)}
.metric[data-live="true"] .metric-v{color:var(--accent)}
.metric[data-bad="true"] .metric-v{color:var(--bad)}

/* ══ Panel ════════════════════════════════════════════════════════════════ */
.panel{background:var(--raise);border:1px solid var(--line);border-radius:var(--r3);
  box-shadow:var(--sh-1);overflow:hidden}
.panel-h{padding:var(--s5) var(--s6);display:flex;align-items:center;
  justify-content:space-between;gap:var(--s4)}
.panel-h+.panel-b{padding-top:0}
.panel-t{font-size:16px;font-weight:600;letter-spacing:-.019em}
.panel-d{font-size:13px;color:var(--ink-2);margin-top:2px}
.panel-b{padding:var(--s5) var(--s6) var(--s6)}
.panel-b.flush{padding:0}
.sep{height:1px;background:var(--line);margin:var(--s5) 0}

/* section heading outside panels */
.sec-h{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.sec-t{font-size:19px;font-weight:600;letter-spacing:-.021em}
.sec-d{font-size:13px;color:var(--ink-3)}

/* ══ Buttons ══════════════════════════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 15px;border-radius:var(--rp);border:1px solid var(--line-2);
  background:var(--raise);font-size:13.5px;font-weight:500;letter-spacing:-.01em;
  cursor:pointer;white-space:nowrap;
  transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),
    transform var(--fast) var(--ease),opacity var(--fast) var(--ease)}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:transparent;color:#fff}
.btn-pri:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn-dan{background:var(--bad);border-color:transparent;color:#fff}
.btn-dan:hover:not(:disabled){filter:brightness(1.08)}
.btn-q{border-color:transparent;background:transparent}
.btn-q:hover:not(:disabled){background:var(--hover)}
.btn-s{height:28px;padding:0 11px;font-size:12.5px}
.btn-i{width:34px;padding:0}
.btn-i.btn-s{width:28px}
.btns{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}

/* ══ Fields ═══════════════════════════════════════════════════════════════ */
.f{display:flex;flex-direction:column;gap:6px}
.f-l{font-size:13px;font-weight:500;letter-spacing:-.008em}
.f-h{font-size:12px;color:var(--ink-3);line-height:1.45}
.inp,.sel{width:100%;height:36px;padding:0 12px;background:var(--raise);
  border:1px solid var(--line-2);border-radius:var(--r1);font-size:13.5px;
  transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease)}
.inp::placeholder{color:var(--ink-3)}
.inp:hover,.sel:hover{border-color:var(--ink-3)}
.inp:focus,.sel:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 16%,transparent)}
.inp:disabled,.sel:disabled{background:var(--sunken);color:var(--ink-3);cursor:not-allowed}
.sel{appearance:none;padding-right:32px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238e8e97' stroke-width='1.7' stroke-linecap='round'><path d='M4 6.5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center}
.f-row{display:flex;gap:var(--s2)}
.f-row .inp{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* switch */
.sw-row{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s2) 0}
.sw{position:relative;flex:none;width:40px;height:24px;border-radius:var(--rp);
  background:var(--g5);border:none;cursor:pointer;padding:0;margin-top:1px;
  transition:background var(--med) var(--ease)}
[data-theme="dark"] .sw{background:#3a3a41}
.sw[data-on="true"]{background:var(--ok)}
.sw-k{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform var(--med) var(--ease)}
.sw[data-on="true"] .sw-k{transform:translateX(16px)}
.sw:disabled{opacity:.45;cursor:not-allowed}
.sw-l{font-size:13.5px;font-weight:500}
.sw-h{font-size:12px;color:var(--ink-3);margin-top:2px;max-width:52ch}

/* ══ Pills ════════════════════════════════════════════════════════════════ */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;
  border-radius:var(--rp);font-size:12px;font-weight:500;border:1px solid transparent;
  white-space:nowrap;letter-spacing:-.005em}
.p-n{background:var(--sunken);color:var(--ink-2);border-color:var(--line)}
.p-a{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-line)}
.p-o{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.p-w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.p-b{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot-l{position:relative}
.dot-l::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  background:currentColor;animation:hb 2s var(--ease) infinite}
@keyframes hb{0%{transform:scale(.5);opacity:.6}70%{transform:scale(2);opacity:0}100%{opacity:0}}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ Runs ═════════════════════════════════════════════════════════════════ */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:170px 1fr auto auto;gap:var(--s4);
  align-items:center;padding:var(--s4) var(--s6);
  border-top:1px solid var(--line);transition:background var(--fast) var(--ease)}
.row:first-child{border-top:none}
.row:hover{background:var(--sunken)}
@media(max-width:860px){.row{grid-template-columns:1fr;gap:var(--s3)}}
.row-id{font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:-.02em}
.row-job{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;margin-top:2px}
.row-mid{min-width:0;display:flex;flex-direction:column;gap:7px}
/* Wraps rather than truncating. The driver verdict reads "1 of 19 well
   subprocess(es) failed", and one line of ellipsis cut it at "1 of 19
   well su…" — which looks like 1 of 19 succeeded, the opposite. */
.row-note{font-size:12.5px;color:var(--ink-2);line-height:1.45;
  white-space:normal;word-break:break-word}
.row-note.warn{color:var(--bad)}
/* A failure needs its reason on the row. Truncating it to one line is what
   sent every past diagnosis to the log files, so this one wraps. */
.row-why{font-size:12.5px;color:var(--bad);line-height:1.45;white-space:pre-wrap;
  word-break:break-word}
.row-time{text-align:right;min-width:78px}
.row-dur{font-size:13px;font-weight:500}
.row-ago{font-size:11.5px;color:var(--ink-3)}
.bar-t{height:3px;background:var(--g4);border-radius:var(--rp);overflow:hidden}
[data-theme="dark"] .bar-t{background:#2a2a2e}
.bar-f{height:100%;background:var(--accent);border-radius:var(--rp);
  transition:width .5s var(--ease)}
.bar-i{height:100%;width:32%;background:var(--accent);border-radius:var(--rp);
  animation:ind 1.5s var(--ease) infinite}
@keyframes ind{0%{margin-left:-32%}100%{margin-left:100%}}

/* stage rail */
.rail{display:flex;align-items:center}
.st{display:flex;align-items:center;gap:6px}
.st-d{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  background:var(--g4);color:var(--ink-3);flex:none;
  transition:background var(--med) var(--ease),color var(--med) var(--ease)}
[data-theme="dark"] .st-d{background:#2a2a2e}
.st[data-s="done"] .st-d{background:var(--ok);color:#fff}
.st[data-s="active"] .st-d{background:var(--accent);color:#fff}
.st[data-s="failed"] .st-d{background:var(--bad);color:#fff}
.st-n{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:-.003em}
.st[data-s="done"] .st-n,.st[data-s="active"] .st-n{color:var(--ink-2)}
.st-l{width:22px;height:1.5px;background:var(--g4);margin:0 5px;flex:none;
  transition:background var(--med) var(--ease)}
[data-theme="dark"] .st-l{background:#2a2a2e}
.st-l[data-d="true"]{background:var(--ok)}
@media(max-width:1000px){.st-n{display:none}.st-l{width:12px}}

/* ══ Code / logs ══════════════════════════════════════════════════════════ */
.code{background:var(--g10);color:#e8e8ed;border-radius:var(--r2);padding:var(--s4);
  font-family:var(--mono);font-size:12px;line-height:1.7;overflow:auto;
  white-space:pre-wrap;word-break:break-word;letter-spacing:-.015em}
[data-theme="dark"] .code{background:#08080a;border:1px solid var(--line)}
.code-s{max-height:320px}
.code-w{position:relative}
.code-c{position:absolute;top:9px;right:9px}
.log{background:var(--g10);border-radius:var(--r2);font-family:var(--mono);font-size:12px;
  line-height:1.65;max-height:290px;overflow:auto;padding:var(--s3) var(--s4);
  letter-spacing:-.015em}
[data-theme="dark"] .log{background:#08080a;border:1px solid var(--line)}
.ll{display:flex;gap:10px;white-space:pre-wrap;word-break:break-word}
.lt{color:#6e6e78;flex:none}
.lv{flex:none;width:42px;font-weight:600}
.l-INFO{color:#5ac8fa}.l-WARNING{color:#ffd60a}.l-ERROR,.l-CRITICAL{color:#ff6961}
.l-DEBUG{color:#6e6e78}
.lm{color:#e8e8ed;flex:1;min-width:0}

/* ══ Callout ══════════════════════════════════════════════════════════════ */
.note{display:flex;gap:var(--s3);padding:var(--s4) var(--s5);border-radius:var(--r2);
  border:1px solid;font-size:13px;line-height:1.5}
.n-a{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent-ink)}
.n-w{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.n-b{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.note code{font-family:var(--mono);font-size:11.5px;padding:1px 5px;border-radius:5px;
  background:rgba(0,0,0,.06)}
[data-theme="dark"] .note code{background:rgba(255,255,255,.1)}
.n-i{flex:none;margin-top:1px}

/* ══ Toast ════════════════════════════════════════════════════════════════ */
.toasts{position:fixed;bottom:var(--s6);left:50%;transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;gap:var(--s2);width:min(440px,calc(100vw - 32px))}
.toast{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--raise);
  border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh-3);
  align-items:flex-start;animation:up .34s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.toast-t{font-size:13px;font-weight:600;letter-spacing:-.01em}
.toast-m{font-size:12.5px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap}

/* ══ Options ══════════════════════════════════════════════════════════════ */
.opt-bar{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s5)}
.srch{flex:1;position:relative}
.srch .inp{padding-left:34px}
.srch-i{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--ink-3);pointer-events:none;display:flex}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:var(--s5) var(--s6);align-items:start}
.grp{min-width:0}
.grp-h{width:100%;display:flex;align-items:center;gap:var(--s2);padding:0 0 var(--s3);
  background:none;border:none;cursor:pointer;text-align:left;
  border-bottom:1px solid var(--line);margin-bottom:var(--s4)}
.grp-n{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.055em;
  color:var(--ink-2)}
.grp-c{font-size:11px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.chev{transition:transform var(--med) var(--ease);color:var(--ink-3);flex:none}
.chev[data-o="true"]{transform:rotate(90deg)}
.grp-b{display:flex;flex-direction:column;gap:var(--s5)}
.mod{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}

/* ══ Browser ══════════════════════════════════════════════════════════════ */
.br{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
  margin-top:var(--s2);background:var(--sunken)}
.br-p{display:flex;gap:var(--s2);padding:var(--s2);border-bottom:1px solid var(--line);
  background:var(--raise)}
.br-l{max-height:240px;overflow:auto}
.br-i{display:flex;align-items:center;gap:var(--s3);padding:9px var(--s4);cursor:pointer;
  border-top:1px solid var(--line);font-size:13px;transition:background var(--fast) var(--ease)}
.br-i:first-child{border-top:none}
.br-i:hover{background:var(--hover)}
.br-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--mono);font-size:12.5px}

/* ══ Empty / skeleton ═════════════════════════════════════════════════════ */
.empty{padding:var(--s10) var(--s6);text-align:center}
.empty-i{width:46px;height:46px;border-radius:var(--r2);background:var(--sunken);
  display:grid;place-items:center;margin:0 auto var(--s4);color:var(--ink-3)}
.empty-t{font-size:15px;font-weight:600;letter-spacing:-.015em}
