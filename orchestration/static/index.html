<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEA Bench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23151b36%27/%3E%3Cg fill=%27%23a996ea%27%3E%3Ccircle cx=%2710%27 cy=%2711%27 r=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2711%27 r=%273%27/%3E%3Ccircle cx=%2722%27 cy=%2711%27 r=%273%27/%3E%3Ccircle cx=%2710%27 cy=%2721%27 r=%273%27/%3E%3Ccircle cx=%2716%27 cy=%2721%27 r=%273%27/%3E%3Ccircle cx=%2722%27 cy=%2721%27 r=%273%27/%3E%3C/g%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("mea-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* MEA Bench. Light: Ink (white paper, hueless black, hairline rules, state pills).
   Dark: Console (graphite in three steps, pale ink, hairline panels).
   Meanings in both: blue = an instrument working, teal = done, red = needs a person,
   amber = a person's choice (priority, copy first, warnings). Mono is only for what a
   machine wrote: paths, ids, times, counts in columns. */

/* ── Fonts (served from /static/vendor/fonts, nothing from the internet) ── */
@font-face{font-family:"Host Grotesk";src:url(/static/vendor/fonts/host-grotesk-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Host Grotesk";src:url(/static/vendor/fonts/host-grotesk-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Host Grotesk";src:url(/static/vendor/fonts/host-grotesk-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Atkinson Mono";src:url(/static/vendor/fonts/atkinson-hyperlegible-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Mono";src:url(/static/vendor/fonts/atkinson-hyperlegible-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}

/* ── Tokens: light (Ink) ── */
:root{
  color-scheme:light;
  --bg:oklch(97.6% .003 100); --panel:oklch(99.7% .002 100); --panel-2:oklch(96.4% .004 100); --deep:oklch(93.8% .005 100);
  --ink:oklch(17% 0 0); --ink-2:oklch(31% 0 0); --muted:oklch(47% 0 0);
  --rule:oklch(90.5% .004 100); --rule-2:oklch(83% .004 100); --rule-strong:var(--ink);
  --cool:oklch(49% .13 252); --cool-soft:oklch(95% .025 252);
  --ok:oklch(48% .09 188); --ok-soft:oklch(94.5% .04 190); --ok-ink:oklch(30% .05 190);
  --bad:oklch(51% .16 28); --bad-soft:oklch(95.5% .025 28); --bad-ink:oklch(36% .12 28);
  --warn:oklch(52% .11 70); --warn-soft:oklch(95.5% .045 85); --warn-ink:oklch(36% .08 65);
  --primary:var(--ink); --primary-ink:var(--panel); --primary-hover:oklch(30% 0 0);
  --code-bg:oklch(20% .006 250); --code-ink:oklch(92% .006 250); --code-rule:oklch(34% .01 250);
  --scrim:oklch(18% 0 0 / .32); --float-shadow:0 18px 40px oklch(18% 0 0 / .18);
  --focus:var(--cool); --sel:var(--ok-soft);
  --sans:"Host Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"Atkinson Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r-ctl:8px;
  --dur-micro:.12s; --dur-short:.2s; --ease-out:cubic-bezier(.2,.8,.2,1);
  /* names the screens still use inline */
  --red:var(--bad); --sheet:var(--panel);
}
/* ── Tokens: dark (Console) ── */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:oklch(16.5% .008 250); --panel:oklch(20.5% .009 250); --panel-2:oklch(23.5% .01 250); --deep:oklch(13.5% .007 250);
  --ink:oklch(95% .005 250); --ink-2:oklch(84% .008 250); --muted:oklch(71% .01 250);
  --rule:oklch(30% .01 250); --rule-2:oklch(40% .012 250); --rule-strong:oklch(55% .012 250);
  --cool:oklch(77% .12 245); --cool-soft:oklch(29% .05 245);
  --ok:oklch(78% .11 178); --ok-soft:oklch(27% .04 180); --ok-ink:oklch(86% .08 178);
  --bad:oklch(71% .16 25); --bad-soft:oklch(26% .045 25); --bad-ink:oklch(86% .07 25);
  --warn:oklch(82% .14 80); --warn-soft:oklch(29% .05 80); --warn-ink:oklch(90% .08 85);
  --primary:oklch(82% .14 80); --primary-ink:oklch(18% .04 75); --primary-hover:oklch(87% .12 82);
  --code-bg:var(--deep); --code-ink:var(--ink-2); --code-rule:var(--rule);
  --scrim:oklch(8% 0 0 / .55); --float-shadow:0 18px 40px oklch(5% 0 0 / .5);
  --focus:var(--warn); --sel:var(--warn-soft);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:oklch(16.5% .008 250); --panel:oklch(20.5% .009 250); --panel-2:oklch(23.5% .01 250); --deep:oklch(13.5% .007 250);
  --ink:oklch(95% .005 250); --ink-2:oklch(84% .008 250); --muted:oklch(71% .01 250);
  --rule:oklch(30% .01 250); --rule-2:oklch(40% .012 250); --rule-strong:oklch(55% .012 250);
  --cool:oklch(77% .12 245); --cool-soft:oklch(29% .05 245);
  --ok:oklch(78% .11 178); --ok-soft:oklch(27% .04 180); --ok-ink:oklch(86% .08 178);
  --bad:oklch(71% .16 25); --bad-soft:oklch(26% .045 25); --bad-ink:oklch(86% .07 25);
  --warn:oklch(82% .14 80); --warn-soft:oklch(29% .05 80); --warn-ink:oklch(90% .08 85);
  --primary:oklch(82% .14 80); --primary-ink:oklch(18% .04 75); --primary-hover:oklch(87% .12 82);
  --code-bg:var(--deep); --code-ink:var(--ink-2); --code-rule:var(--rule);
  --scrim:oklch(8% 0 0 / .55); --float-shadow:0 18px 40px oklch(5% 0 0 / .5);
  --focus:var(--warn); --sel:var(--warn-soft);
}

/* ── Base ── */
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:var(--sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::selection{background:var(--sel);color:var(--ink)}
button{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-size:.9em}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Layout ── */
.wrap{max-width:1240px;margin:0 auto;padding:20px 32px 72px}
@media (max-width:760px){.wrap{padding:14px 16px 56px}}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule-strong)}
.brand{font-size:22px;line-height:1.1;font-weight:600;letter-spacing:-.02em}
.brand i{font-style:normal}
.brand-sub{font-size:13px;color:var(--muted);margin-top:2px}
.grow{flex:1}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.livechip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);height:30px;
  padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--panel)}
.livechip b{color:var(--ink);font-weight:600}

/* tabs: plain text, the open one underlined in ink */
.tabs{display:flex;gap:2px;margin:4px 0 26px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{border:none;background:none;cursor:pointer;padding:12px 14px 11px;font-weight:500;font-size:14px;color:var(--muted);
  position:relative;margin-bottom:-1px;border-bottom:2px solid transparent;transition:color var(--dur-micro)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:11.5px;margin-left:7px;padding:1px 7px;border-radius:999px;
  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--rule)}
.tabline{display:none}

/* ── Buttons ── */
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border-radius:var(--r-ctl);border:1px solid var(--rule-2);background:var(--panel);cursor:pointer;font-weight:500;font-size:14px;
  transition:background-color var(--dur-micro),border-color var(--dur-micro),color var(--dur-micro);white-space:nowrap}
.btn:hover{border-color:var(--muted);background:var(--panel-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ink{background:var(--primary);color:var(--primary-ink)!important;border-color:var(--primary)}
.btn.ink:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.red{background:var(--panel);color:var(--bad);border-color:var(--rule-2)}
.btn.red:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tile:focus-within{outline:2px solid var(--focus);outline-offset:2px}

/* ── Numbers strip: plain figures, colour only when it means something ── */
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:28px;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);overflow:hidden}
@media (max-width:760px){.tally{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qbar{display:flex;justify-content:flex-end;margin:-14px 0 12px}
.tal{padding:16px 20px 14px;border-right:1px solid var(--rule)}
.tal:last-child{border-right:none}
.tal-v{font-size:36px;line-height:1;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tal-k{font-size:13px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:7px}
.tal[data-k="run"] .tal-v{color:var(--cool)}
.tal[data-k="bad"][data-on="true"] .tal-v{color:var(--bad)}
.tal[data-k="bad"][data-on="true"]{background:var(--bad-soft)}

/* ── Sections ── */
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sec-t{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.sec-d{color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r)}
.card-b{padding:18px 20px}
.hint{color:var(--ink-2);font-size:13.5px}
.hint-s{color:var(--muted);font-size:12.5px}

/* ── Ledger rows (one per recording date) ── */
.ledger{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.proj{padding:12px 20px 9px;display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
.proj-n{font-size:16px;font-weight:600;color:var(--ink)}
.proj-c{font-size:12.5px;color:var(--muted)}
.line{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--rule);transition:background-color var(--dur-micro)}
.line:hover{background:var(--panel-2)}
.line:last-child{border-bottom:none}
@media (max-width:860px){.line{grid-template-columns:minmax(0,1fr);gap:10px}}
.d-big{font-size:18px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.d-code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.mid{min-width:0}
.lanes{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.lane{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.lane .lk{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.dot.run{background:var(--cool)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.dot.wait{background:transparent;border:1.5px solid var(--muted)}
.dot.queue{background:var(--warn)}
.say{font-size:15px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* state pills: sentence case, the label face, tinted by meaning */
.stamp{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.5;
  background:var(--panel-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule);white-space:nowrap}
.stamp::first-letter{text-transform:uppercase}
.stamp.ok{color:var(--ok-ink);background:var(--ok-soft);box-shadow:none}
.stamp.bad{color:var(--bad-ink);background:var(--bad-soft);box-shadow:none}
.stamp.run{color:var(--cool);background:var(--cool-soft);box-shadow:none}
.stamp.wait{background:transparent;color:var(--muted)}
.stamp.queue{background:transparent;color:var(--ink-2)}
.stamp.prio{color:var(--warn-ink);background:var(--warn-soft);box-shadow:none}
.note-l{font-size:13px;color:var(--ink-2)}
.note-l.warn{color:var(--warn-ink)}
.note-l.bad{color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* indeterminate progress (state, not decoration) */
.flow{height:3px;border-radius:3px;background:var(--cool-soft);overflow:hidden;margin-top:9px;max-width:420px}
.flow i{display:block;height:100%;width:35%;border-radius:3px;background:var(--cool);animation:flow 1.6s ease-in-out infinite}
@keyframes flow{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}

/* ── Plate map (wells) ── */
.plate-wrap{padding:6px 20px 20px 188px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
@media (max-width:860px){.plate-wrap{padding:6px 16px 18px}}
.plates{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.plate{border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);padding:12px 14px}
.plate-h{font-size:12.5px;color:var(--muted);margin-bottom:9px;display:flex;gap:8px;align-items:baseline}
.plate-h b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.wells{display:grid;grid-template-columns:repeat(6,30px);gap:7px}
.well{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-size:10.5px;border:1.5px solid var(--rule-2);color:var(--muted);background:var(--panel);cursor:default}
.well.complete{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.well.failed{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.well.running{background:var(--cool-soft);border-color:var(--cool);color:var(--cool)}
.well.silent{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.well.absent{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.well.none{background:transparent;border-style:dotted;opacity:.45}
.well-k{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--rule-2);background:var(--panel)}
.well-k.complete{background:var(--ok);border-color:var(--ok)}
.well-k.silent{background:var(--warn-soft);border-color:var(--warn)}
.well-k.running{background:var(--cool-soft);border-color:var(--cool)}
.well-k.failed{background:var(--bad);border-color:var(--bad)}
.well-k.absent{border-style:dashed;border-color:var(--muted)}
.well-k.none{border-style:dotted;opacity:.6}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.probs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.prob{font-size:13.5px;display:flex;gap:10px;align-items:baseline}
.prob .w{font-family:var(--mono);font-size:12px;color:var(--bad);flex:none;min-width:130px}

/* ── Tiles (add recordings) ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{position:relative;display:block;padding:14px 16px 13px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--panel);cursor:pointer;transition:border-color var(--dur-micro),background-color var(--dur-micro)}
.tile:hover{border-color:var(--muted)}
.tile input{position:absolute;opacity:0}
.tile[data-on="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--panel-2)}
.tile[data-done="true"]:not([data-on="true"]){opacity:.7}
.t-date{font-size:18px;font-weight:600;letter-spacing:-.01em;display:inline}
.t-code{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}
.t-what{font-size:12.5px;color:var(--ink-2);margin-top:9px}
.t-tag{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
.t-tag::first-letter{text-transform:uppercase}
.t-tag.done{color:var(--ok-ink);background:var(--ok-soft)}
.t-tag.copy{color:var(--warn-ink);background:var(--warn-soft)}
.t-tick{position:absolute;bottom:12px;right:12px;width:20px;height:20px;border-radius:6px;
  border:1.5px solid var(--rule-2);display:grid;place-items:center;background:var(--panel)}
.tile[data-on="true"] .t-tick{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.sticky{position:sticky;bottom:16px;margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:12px 14px;border-radius:var(--r);background:var(--ink);color:var(--panel);box-shadow:var(--float-shadow)}
.sticky .btn{border-color:transparent}
.sticky .btn.lite{background:var(--panel);color:var(--ink)}
.sticky .btn.lite:hover{background:var(--panel-2)}
.sticky .btn.ink{background:var(--primary);color:var(--primary-ink)!important}
.prio-pick{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.t-who{font-size:12px;color:var(--muted);margin-top:4px;padding-right:24px}
.dup{margin-top:6px;font-size:13px;max-height:40vh;overflow:auto}
.dup-t{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.dup-i{margin:6px 0 0 20px}
.mono-s{font-family:var(--mono);font-size:11.5px;opacity:.85;word-break:break-all}
.who{margin:2px 0 4px}
.me{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);
  padding-left:10px;margin-left:2px;border-left:1px solid var(--rule)}

/* ── Forms ── */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.f-l{font-weight:600;font-size:14px}
.inp,.sel,textarea.inp{width:100%;height:38px;padding:0 12px;border:1px solid var(--rule-2);border-radius:var(--r-ctl);
  background:var(--panel);font:inherit;color:var(--ink);transition:border-color var(--dur-micro),box-shadow var(--dur-micro)}
textarea.inp{height:auto;padding:10px 12px;line-height:1.55;resize:vertical}
.inp:focus,.sel:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--cool-soft)}
.inp:focus-visible,.sel:focus-visible{outline:none}
.inp.mono{font-family:var(--mono);font-size:13.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.row2{grid-template-columns:minmax(0,1fr)}}
.f-row{display:flex;gap:8px}
.f-row .inp{flex:1;min-width:0}
.sw-row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule)}
.sw-row:first-child{border-top:none}
.sw{flex:none;width:40px;height:22px;border-radius:999px;border:none;background:var(--rule-2);position:relative;cursor:pointer;
  transition:background-color var(--dur-short);margin-top:1px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--panel);
  transition:transform var(--dur-short) var(--ease-out)}
.sw[aria-checked="true"]{background:var(--ok)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.sw-l{font-weight:500}
.sw-h{font-size:13px;color:var(--muted);margin-top:2px}
.callout{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r);font-size:14px;align-items:flex-start;
  border:1px solid var(--rule);background:var(--panel-2)}
.callout.blue{background:var(--cool-soft);border-color:transparent}
.callout.red{background:var(--bad-soft);border-color:transparent;color:var(--bad-ink)}
.callout.amber{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.callout.green{background:var(--ok-soft);border-color:transparent;color:var(--ok-ink)}
.callout .ic{flex:none;margin-top:1px}

details.adv{margin-top:8px}
details.adv>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:8px;
  font-weight:600;color:var(--ink);padding:8px 0;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
details.adv>summary:hover{text-decoration-color:var(--ink)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary .chev{transition:transform var(--dur-short)}
details.adv[open]>summary .chev{transform:rotate(90deg)}
.grp{border:1px solid var(--rule);border-radius:var(--r);margin-top:10px;background:var(--panel)}
.grp-h{width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;border:none;background:none;
  cursor:pointer;text-align:left;font-weight:600}
.grp-b{padding:4px 14px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px}
@media (max-width:760px){.grp-b{grid-template-columns:minmax(0,1fr)}}
.grp-b .f{margin-bottom:8px}

/* ── Code + folder browser ── */
.code{position:relative;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--code-ink);
  border:1px solid var(--code-rule);border-radius:var(--r-ctl);padding:12px 84px 12px 14px;white-space:pre-wrap;word-break:break-all;margin:0}
.code .cp{position:absolute;top:8px;right:8px;height:26px;font-size:12px;padding:0 9px;border-radius:6px;
  border:1px solid var(--code-rule);background:transparent;color:var(--code-ink);cursor:pointer}
.br{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;background:var(--panel);margin-top:6px}
.br-p{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--rule);background:var(--panel-2)}
.br-l{max-height:280px;overflow:auto}
.br-i{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--rule)}
.br-i:hover{background:var(--panel-2)}
.br-i .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Drawer (log) + modal: the only things that float, so the only shadows ── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade var(--dur-short) ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);z-index:41;background:var(--panel);
  border-left:1px solid var(--rule);box-shadow:var(--float-shadow);display:flex;flex-direction:column;
  animation:slide .24s var(--ease-out) both}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}
.dr-h{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.dr-t{font-size:20px;font-weight:600;letter-spacing:-.015em}
.dr-b{flex:1;overflow:auto;padding:14px 0;background:var(--deep)}
.lg{font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:1px 22px;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.lg.err{background:var(--bad-soft);color:var(--bad-ink);box-shadow:inset 3px 0 0 var(--bad)}
.lg.warn{color:var(--warn-ink)}
.lg.ok{color:var(--ok)}
.modal{position:fixed;z-index:51;left:50%;top:22vh;transform:translateX(-50%);width:min(480px,92vw);background:var(--panel);
  border:1px solid var(--rule);border-radius:12px;padding:22px 24px 18px;box-shadow:var(--float-shadow);
  animation:fade var(--dur-short) ease both}
.modal h3{font-weight:600;font-size:19px;letter-spacing:-.015em;margin:0 0 8px}
.modal .acts{margin-top:18px}
.scrim.m{z-index:50}

/* ── Feed, toasts, skeleton ── */
.feed{font-size:13.5px}
.feed-i{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.feed-i:last-child{border-bottom:none}
.feed-t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.feed-i.err .feed-m{color:var(--bad)}
.toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;width:min(380px,90vw)}
.toast{background:var(--ink);color:var(--panel);border-radius:var(--r);padding:12px 14px;display:flex;gap:11px;
  box-shadow:var(--float-shadow);animation:fade var(--dur-short) ease both}
.toast.err{background:var(--bad);color:var(--panel)}
.toast-t{font-weight:600}
.toast-m{font-size:13px;opacity:.88;margin-top:2px;white-space:pre-wrap}
.empty{padding:44px 24px;text-align:center}
.empty-t{font-size:19px;font-weight:600;letter-spacing:-.015em}
.empty-d{color:var(--ink-2);max-width:460px;margin:8px auto 0}
.skel{background:var(--panel-2);border-radius:var(--r-ctl);animation:sh 1.4s ease-in-out infinite}
@keyframes sh{50%{opacity:.55}}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;
  animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Dashboard ── */
.slots{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-weight:500;margin-bottom:24px;
  padding:12px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--panel)}
.wp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule)}
.wp:last-child{border-bottom:none}
.wp[data-paused="true"]{background:var(--panel-2)}
.wp-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wp-p{word-break:break-all;margin-top:2px}
.wp-c{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-2)}
.wp-c b{color:var(--ink);font-weight:600}
.wp .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:760px){.wp{grid-template-columns:minmax(0,1fr)}}
.hsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.hsteps li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:var(--r-ctl);background:var(--panel-2)}
.hsteps li div{min-width:0;overflow-wrap:anywhere}
.hsteps .hs-i{flex:none;margin-top:2px}
.hsteps li.ok .hs-i{color:var(--ok)}
.hsteps li.bad{background:var(--bad-soft)}
.hsteps li.bad .hs-i{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-ctl);overflow:hidden}
.seg-o{position:relative;display:flex;align-items:center;gap:6px;padding:7px 14px;font-size:14px;cursor:pointer;background:var(--panel)}
.seg-o+.seg-o{border-left:1px solid var(--rule-2)}
.seg-o.on{background:var(--ink);color:var(--panel);font-weight:600}
.seg-o input{position:absolute;opacity:0;pointer-events:none}
.seg-o:focus-within{outline:2px solid var(--focus);outline-offset:-2px}
.cl-node{display:grid;grid-template-columns:minmax(150px,1fr) 2fr 2fr minmax(140px,1fr) auto;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule);align-items:center}
.cl-node:last-child{border-bottom:none}
@media (max-width:900px){.cl-node{grid-template-columns:minmax(0,1fr)}}
.sugg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sugg-i{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:8px 12px;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--panel)}
.att{display:flex;flex-direction:column;gap:8px}
.att-i{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);border:1px solid var(--rule);background:var(--panel)}
.att-i.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad-ink)}
.att-i.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.att-i .ic{flex:none}
.runcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.runcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--rule);transition:border-color var(--dur-micro)}
.runcard:hover{border-color:var(--cool)}
.runcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-date{font-size:18px;font-weight:600;letter-spacing:-.01em}
.rc-meta{font-size:14px}
.bar{height:5px;border-radius:5px;background:var(--cool-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--cool);border-radius:5px;transition:transform var(--dur-short)}
.health{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
@media (max-width:760px){.health{grid-template-columns:minmax(0,1fr)}}
.hcell{padding:14px 16px;border-right:1px solid var(--rule);background:var(--panel-2)}
.hcell:last-child{border-right:none}
.h-k{font-size:13px;color:var(--muted)}
.h-v{font-size:26px;line-height:1.15;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.disks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 26px;margin-bottom:18px}
@media (max-width:760px){.disks{grid-template-columns:minmax(0,1fr)}}
.meter-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.meter{height:6px;border-radius:6px;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--rule);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--ink-2)}
.meter i[data-k="warn"]{background:var(--warn)}
.meter i[data-k="bad"]{background:var(--bad)}
.sub-h{font-weight:600;margin:6px 0 8px}

/* tables: an ink rule on top, hairlines between rows */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:8px 10px;
  border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl.hover tbody tr{cursor:pointer}
.tbl.hover tbody tr:hover{background:var(--panel-2)}
.tbl.hover tbody tr:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tw{overflow-x:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .sel{width:auto;min-width:170px;height:34px}

/* run page */
.rd-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:18px 0 20px}
.rd-t{font-size:32px;font-weight:600;line-height:1.05;letter-spacing:-.025em;overflow-wrap:break-word;min-width:0}
.rd-v{font-size:19px;font-weight:500;margin-top:4px;letter-spacing:-.01em}
.tl{list-style:none;margin:0;padding:0 0 0 4px}
.tl li{position:relative;padding:4px 0 12px 22px;border-left:1px solid var(--rule-2);display:flex;gap:14px;flex-wrap:wrap}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--muted);
  box-shadow:0 0 0 3px var(--panel)}
.tl li[data-k="ok"]::before{background:var(--ok)}
.tl li[data-k="bad"]::before{background:var(--bad)}
.tl li[data-k="run"]::before{background:var(--cool)}
.tl li[data-k="queue"]::before{background:var(--warn)}
.tl-t{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:150px}
.outs{display:flex;flex-direction:column;gap:12px}
.out{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.out:last-child{border-bottom:none;padding-bottom:0}
.out .mono{grid-column:1;color:var(--muted);overflow-wrap:anywhere}
.out .btn{grid-column:2;grid-row:1/3}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 18px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-all}
@media (max-width:760px){.kv{grid-template-columns:minmax(0,1fr)}}

/* no entrance choreography on a working screen: content is there at once */
.rise{animation:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.foot{margin-top:50px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
